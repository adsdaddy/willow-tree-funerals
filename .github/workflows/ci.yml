name: Portable website checks
on:
  push:
    branches: [main, 'migration/**']
  pull_request:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      VITE_GA4_MEASUREMENT_ID: G-ZPSZ3KQRF4
      VITE_META_PIXEL_ID: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - run: corepack enable && corepack prepare pnpm@10.4.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:migration
      - run: pnpm build
      - name: Ensure there are no platform runtime hooks or unresolved placeholders
        run: |
          ! grep -R -E '__manus__|manus-analytics\.com|api\.manus\.im|%VITE_' dist/public
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag willow-tree-funerals:ci .
